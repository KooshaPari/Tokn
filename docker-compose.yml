# docker-compose.yml — Local development stack for Tokn.
#
# Services:
#   tokn       — Rust CLI + library, opens /metrics and /health
#   prometheus — scrapes /metrics from tokn
#   grafana    — visualises the Prometheus data
#
# Usage:
#   docker compose up --build
#   # Grafana: http://localhost:3000 (admin/admin, dashboard auto-imported)
#   # Prometheus: http://localhost:9090
#
version: "3.9"

services:
  tokn:
    build:
      context: .
      dockerfile: Dockerfile
    image: tokn:${TOKN_IMAGE_TAG:-latest}
    ports:
      - "8443:8443"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - TOKN_METRICS_PORT=8443
    volumes:
      - tokn-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:${PROM_VERSION:-v2.54.1}
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.2.2}
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  tokn-data:
    driver: local
  prom-data:
    driver: local
  grafana-data:
    driver: local
